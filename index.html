<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Procedural World</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        font-family: 'Courier New', monospace;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.7);
        color: #fff;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #overlay.hidden {
        opacity: 0;
      }
      #overlay h1 {
        font-size: 2rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #e8c87a;
        text-shadow: 0 0 20px #e8c87a88;
        margin-bottom: 1rem;
      }
      #overlay p {
        font-size: 0.9rem;
        color: #aaa;
        letter-spacing: 0.1em;
      }
      #overlay.click-to-start {
        pointer-events: all;
        cursor: pointer;
      }
      #biome-hud {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.5);
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 0 8px rgba(0,0,0,0.8);
      }
      #time-hud {
        position: absolute;
        top: 15px;
        right: 20px;
        color: rgba(255,255,255,0.4);
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="overlay" class="click-to-start">
        <div>
          <h1>Retro World</h1>
          <p>Click to explore</p>
          <p style="margin-top:0.5rem; font-size:0.7rem;">WASD — move &nbsp;|&nbsp; Mouse — look</p>
        </div>
      </div>
      <div id="biome-hud"></div>
      <div id="time-hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
